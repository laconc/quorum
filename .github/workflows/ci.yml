name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Jobs invoke the same `make` targets a developer runs locally, so continuous
# integration and a laptop do exactly the same things. The Makefile lives at the
# repository root and drives cargo inside app/, so steps run from the root.
#
# Every action is pinned by commit hash. A tag is mutable, which makes an
# unpinned action a supply-chain hole with write access to the build.

permissions:
  contents: read

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app
      - run: make fmt-check
      - run: make clippy

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app
      - run: make test

  msrv:
    name: msrv (1.98)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action; toolchain set below
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app
      - run: make msrv

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app
      - run: make doc

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-deny
      - run: make deny

  e2e:
    name: end-to-end + accessibility + screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      # The runner image ships a current Node, so there is no setup-node action
      # to pin here. One fewer third party in the build.
      - run: make e2e-install
      - run: make e2e

      # Two consecutive runs must produce byte-identical images. This is the
      # test that keeps the gallery trustworthy: a pipeline that churns makes
      # both the visual record and the regression baseline worthless.
      - run: make screenshots-verify

      # The committed gallery must match what the pipeline produces, so an
      # interface change cannot land with a stale image beside it.
      - name: The committed gallery is current
        run: |
          if ! git diff --quiet -- docs/screenshots; then
            echo "::error::docs/screenshots is stale. Run 'make screenshots' and commit the result."
            git diff --stat -- docs/screenshots
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  frontend-gate:
    name: screenshots accompany frontend changes
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Screenshots are required only when the change touches the frontend, and
      # that judgement comes from the diff rather than from the author. A
      # backend-only change is not asked for images it has no reason to have.
      - name: Require a gallery change when the frontend changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE" "$HEAD")"

          frontend="$(printf '%s\n' "$changed" | grep -E '^app/crates/web/(templates|static|src/view)/' || true)"
          gallery="$(printf '%s\n' "$changed" | grep -E '^docs/screenshots/.*\.png$' || true)"

          if [ -z "$frontend" ]; then
            echo "No frontend change; screenshots are not required."
            exit 0
          fi

          echo "Frontend files changed:"
          printf '%s\n' "$frontend"

          if [ -z "$gallery" ]; then
            echo "::error::This change touches the frontend but updates no screenshot."
            echo "::error::Run 'make screenshots', commit the result, and add the images"
            echo "::error::to the pull request with 'make pr-screenshots'."
            exit 1
          fi

          echo "Gallery updated:"
          printf '%s\n' "$gallery"
